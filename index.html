<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineMarket</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="flowers"></div>

  <!-- CABEÇALHO -->
  <header>
    <b class="logo-topo">MINEMARKET</b>

    <nav class="menu">
      <button onclick="abrirAba('inicio')">INÍCIO</button>
      <button onclick="abrirAba('capas')">CAPAS</button>
      <button onclick="abrirAba('contas')">CONTAS</button>
    </nav>
  </header>


  <!-- ================= INÍCIO ================= -->

 <!-- ================= INÍCIO ================= -->

<section id="aba-inicio" class="pagina-aba ativa">

  <div class="inicio-mundo">

    <!-- CONTEÚDO SOBRE O CÉU -->
    <div class="inicio-conteudo">

      <small>CATÁLOGO MINECRAFT</small>

      <p>Contas e capas Minecraft</p>

      <div class="category-buttons">
        <button onclick="abrirAba('capas')">
          CAPAS
        </button>

        <button onclick="abrirAba('contas')">
          CONTAS
        </button>
      </div>

    </div>

    <!-- MUNDO -->
    <img
      src="banner%20novo2.png"
      alt="Mundo MineMarket"
      class="mundo-img"
    >

  </div>

</section>


  <!-- ================= CAPAS ================= -->

  <section id="aba-capas" class="pagina-aba">

    <div class="titulo-categoria">
      <small>MINEMARKET</small>
      <h2>CAPAS</h2>
      <p>Capas exclusivas para sua conta Minecraft.</p>
    </div>

    <section class="search">
      <input
        id="q-capas"
        placeholder="Pesquisar capa..."
      >
    </section>

    <div
      id="grid-capas"
      class="produtos-grid">
    </div>

  </section>


  <!-- ================= CONTAS ================= -->

  <section id="aba-contas" class="pagina-aba">

    <div class="titulo-categoria">
      <small>MINEMARKET</small>
      <h2>CONTAS</h2>
      <p>Contas Minecraft disponíveis.</p>
    </div>

    <section class="search">
      <input
        id="q"
        placeholder="Pesquisar conta..."
      >
    </section>

    <div
      id="grid"
      class="produtos-grid">
    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
